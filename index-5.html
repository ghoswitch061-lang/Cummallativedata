<style>
  :root {
    --bg: #06070d;
    --ink: #f4efe3;
    --text: #e9e7f2;
    --muted: #9b99ae;
    --line: rgba(255,255,255,0.08);
    --gold: #e8c987;
    --violet: #a594ff;
    --green: #6ee7a8;
    --red: #ff8585;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {

  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .aurora i:nth-child(2) { width: 36vw; height: 36vw; right: -10vw; top: 22vh; background: #b8862b; opacity: .2; animation: drift2 34s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { width: 34vw; height: 34vw; left: 28vw; bottom: -20vw; background: #1f6f8b; opacity: .28; animation: drift3 30s ease-in-out infinite alternate; }

  @keyframes drift2 { to { transform: translate(-12vw, -10vh) scale(1.2); } }
  @keyframes drift3 { to { transform: translate(-10vw, -8vh) scale(1.1); } }
  .vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(6,7,13,.75)); }

  .loadbar {
    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 100; opacity: 0; transition: opacity .5s;
    background: linear-gradient(90deg, transparent, var(--gold), var(--violet), transparent) no-repeat; background-size: 40% 100%;
    animation: sweep 1.3s linear infinite;
  }
  .loadbar.on { opacity: 1; }
  @keyframes sweep { from { background-position: -50% 0; } to { background-position: 150% 0; } }

  .container { max-width: 1240px; margin: 0 auto; padding: 2.6rem 1.25rem 4.5rem; position: relative; z-index: 1; }

  /* Header */
  header { text-align: center; padding: 1.4rem 0 2.2rem; }
  header h1 {
    font-family: var(--serif); font-weight: 500; color: var(--ink);
    font-size: clamp(2.3rem, 6vw, 4.3rem); letter-spacing: -.025em; line-height: 1.06;
  }
  header h1 .w { display: inline-block; opacity: 0; transform: translateY(.45em); filter: blur(8px);
    animation: wordIn 1.1s var(--ease) forwards; animation-delay: calc(var(--i) * 90ms + 120ms); }
  @keyframes wordIn { to { opacity: 1; transform: none; filter: none; } }
  header .rule { height: 1px; width: min(240px, 50%); margin: 1.5rem auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); transform: scaleX(0); animation: grow 1.4s .7s var(--ease) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  header p { color: var(--muted); margin-top: 1.1rem; opacity: 0; animation: fadeIn 1s .9s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  .header-actions { display: flex; justify-content: center; gap: .7rem; margin-top: 1.4rem; flex-wrap: wrap; align-items: center; opacity: 0; animation: fadeIn 1s 1.1s ease forwards; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: .5rem; color: var(--text); text-decoration: none; font: inherit; font-size: .88rem;
    padding: .5rem 1.1rem; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04);
    backdrop-filter: blur(10px); transition: border-color .3s, background .3s, transform .4s var(--ease);
  }
  .pill-btn:hover { border-color: rgba(232,201,135,.45); background: rgba(232,201,135,.08); transform: translateY(-1px); }
  .pill-btn:disabled { opacity: .5; cursor: progress; }
  .pill-btn .spin { display: inline-block; transition: transform .6s var(--ease); }
  .pill-btn:hover .spin { transform: rotate(180deg); }
  .status { font-size: .8rem; color: var(--muted); padding: .35rem .85rem; border-radius: 999px; background: rgba(255,255,255,.04); display: inline-flex; align-items: center; gap: .5rem; }
  .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.live { color: var(--green); background: rgba(110,231,168,.08); }
  .status.live::before { animation: pulse 2s ease-out infinite; }
  .status.warn { color: var(--gold); background: rgba(232,201,135,.08); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(110,231,168,.55); } 100% { box-shadow: 0 0 0 9px rgba(110,231,168,0); } }

  /* Tabs */
  .tabs-bar { position: sticky; top: 0; z-index: 30; padding: .8rem 0; margin-bottom: 2.2rem; display: flex; justify-content: center; }
  .tabs-wrap { max-width: 100%; border: 1px solid var(--line); background: rgba(12,13,24,.72); backdrop-filter: blur(16px); border-radius: 999px; padding: .3rem; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .tabs { position: relative; display: flex; overflow-x: auto; scrollbar-width: none; border-radius: 999px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-ind {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 999px; pointer-events: none;
    background: linear-gradient(135deg, rgba(165,148,255,.3), rgba(232,201,135,.2)); border: 1px solid rgba(232,201,135,.35);
    box-shadow: 0 0 28px rgba(165,148,255,.25); transition: transform .55s var(--ease), width .55s var(--ease);
  }
  .tab { position: relative; z-index: 1; flex: 0 0 auto; font: inherit; font-size: .9rem; font-weight: 500; color: var(--muted); background: none; border: 0;
    border-radius: 999px; padding: .55rem 1.1rem; cursor: pointer; white-space: nowrap; transition: color .3s; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--ink); }

  .panel { animation: panelIn .6s var(--ease); }
  .panel[hidden] { display: none; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Scroll reveal */
  .reveal { opacity: 0; }
  .reveal.in { opacity: 1; animation: rise .95s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 80ms); }
  .block.reveal.in { animation-name: fadeOnly; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }

  /* Layout blocks */
  .lede { color: #cfcde0; max-width: 72ch; margin: 0 auto 2.4rem; text-align: center; font-size: 1.02rem; }
  .block { margin-bottom: 3.2rem; }
  .block > h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.45rem, 3vw, 1.9rem); color: var(--ink); letter-spacing: -.01em; margin-bottom: .3rem; }
  .block > h2::after { content: ''; display: block; height: 1px; width: 0; margin-top: .65rem; background: linear-gradient(90deg, var(--gold), transparent); transition: width 1.3s .25s var(--ease); }
  .block.in > h2::after { width: min(280px, 60%); }
  .block > .sub { color: var(--muted); font-size: .9rem; margin-top: .6rem; }
  .block > h2 + *, .block > .sub + * { margin-top: 1.3rem; }

  /* Glass cards */
  .kpi, .chart-card, .guide button, .numbered li {
    position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 1.25rem;
    background: linear-gradient(155deg, rgba(255,255,255,.06), rgba(255,255,255,.012));
    transition: border-color .4s, transform .6s var(--ease), box-shadow .6s;
  }
  .kpi::after, .chart-card::after, .guide button::after, .numbered li::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(232,201,135,.11), transparent 55%);
  }
  .kpi:hover, .chart-card:hover, .guide button:hover, .numbered li:hover { border-color: rgba(232,201,135,.3); transform: translateY(-3px); box-shadow: 0 24px 50px -20px rgba(0,0,0,.7); }
  .kpi:hover::after, .chart-card:hover::after, .guide button:hover::after, .numbered li:hover::after { opacity: 1; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin-bottom: 1.2rem; }
  .kpi { padding: 1.35rem 1.45rem; }
  .kpi .label { font-size: .84rem; color: var(--muted); }
  .kpi .value { font-family: var(--serif); font-weight: 500; font-size: 2.7rem; line-height: 1.1; margin-top: .35rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi .value.pos { color: var(--green); } .kpi .value.neg { color: var(--red); }

  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 1.2rem; margin-bottom: 1.2rem; }
  .chart-card { padding: 1.3rem 1.4rem 1.2rem; min-width: 0; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-card h3 { font-family: var(--serif); font-weight: 500; font-size: 1.12rem; color: var(--ink); margin-bottom: 1rem; }
  .chart-box { position: relative; height: 320px; }
  .chart-box.tall { height: 420px; }

  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 1.1rem; background: rgba(255,255,255,.025); margin-bottom: 1.2rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: top; }
  th { background: rgba(255,255,255,.05); font-weight: 500; font-size: .82rem; color: var(--muted); white-space: nowrap; position: sticky; top: 0; }
  td:first-child { font-weight: 500; color: var(--ink); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.pos { color: var(--green); } td.neg { color: var(--red); } td.dim { color: #5f6275; }
  tbody tr { transition: background .25s; }
  tbody tr:hover { background: rgba(232,201,135,.05); }
  tbody tr:last-child td { border-bottom: none; }
  tr.total td { font-weight: 600; background: rgba(165,148,255,.1); }
  tr.muted td { color: var(--muted); font-size: .85rem; }
  .badge { font-size: .74rem; padding: .18rem .65rem; border-radius: 999px; font-weight: 500; }
  .badge.actual { color: var(--green); background: rgba(110,231,168,.12); }
  .badge.model { color: var(--gold); background: rgba(232,201,135,.12); }

  /* Text pieces */
  .insights { list-style: none; display: grid; gap: .75rem; }
  .insights li { position: relative; padding: .9rem 1.1rem .9rem 1.4rem; background: rgba(255,255,255,.035); border-radius: .9rem; color: #dcdaea; }
  .insights li::before { content: ''; position: absolute; left: 0; top: .7rem; bottom: .7rem; width: 2px; border-radius: 2px; background: linear-gradient(var(--gold), var(--violet)); }
  .gloss { display: grid; grid-template-columns: minmax(150px, 230px) 1fr; gap: .6rem 1.4rem; }
  .gloss dt { font-weight: 500; color: var(--ink); } .gloss dd { color: var(--muted); }
  .note { color: var(--muted); font-size: .85rem; margin: -.4rem 0 1.2rem; max-width: 90ch; }
  .guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
  .guide button { text-align: left; font: inherit; color: var(--text); cursor: pointer; padding: 1.2rem 1.3rem; }
  .guide strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.1rem; color: var(--ink); margin-bottom: .3rem; }
  .guide span { color: var(--muted); font-size: .88rem; }
  .numbered { list-style: none; display: grid; gap: .8rem; }
  .numbered li { display: flex; gap: 1rem; align-items: center; padding: 1.05rem 1.3rem; }
  .numbered .n { flex: 0 0 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-weight: 500;
    color: var(--gold); border: 1px solid rgba(232,201,135,.4); background: rgba(232,201,135,.08); }
  .empty { text-align: center; padding: 4rem 1rem; color: var(--muted); border: 1px dashed rgba(255,255,255,.14); border-radius: 1.3rem; }
  .empty strong { display: block; color: var(--ink); font-family: var(--serif); font-weight: 500; font-size: 1.3rem; margin-bottom: .5rem; }

  footer { text-align: center; color: var(--muted); font-size: .84rem; margin-top: 3rem; padding-top: 1.6rem; border-top: 1px solid var(--line); }

  @media (max-width: 640px) {
    .kpi .value { font-size: 2.2rem; }
    .gloss { grid-template-columns: 1fr; }
    .chart-box { height: 280px; }
    .tabs-bar { margin-left: -1.25rem; margin-right: -1.25rem; padding-left: .6rem; padding-right: .6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal, header h1 .w, header p, .header-actions { opacity: 1 !important; transform: none !important; filter: none !important; }
    header .rule { transform: none; } html { scroll-behavior: auto; }
  }
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (!s || /^[—–-]$/.test(s)) return null;
  const n = parseFloat(s.replace(/[+,%\s]/g, '').replace('−', '-'));
  return isNaN(n) ? null : n;
}
function wrap(s, n = 16) {
  const out = []; let line = '';
  for (const w of String(s).split(/\s+/)) {
    if (line && (line + ' ' + w).length > n) { out.push(line); line = w; } else line = (line + ' ' + w).trim();
  }
  if (line) out.push(line);
  return out.length > 1 ? out : (out[0] || '');
}
const filled = r => r.filter(c => c !== '').length;

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell.trim()); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell.trim()); rows.push(row); }
  return tidy(rows);
}
function tidy(rows) {
  const out = [];
  for (let r of rows) {
    r = r.slice(); while (r.length && r[r.length-1] === '') r.pop();
    if (!r.length && (!out.length || !out[out.length-1].length)) continue;
    out.push(r);
  }
  while (out.length && !out[out.length-1].length) out.pop();
  return out;
}

const clean = s => String(s || '').replace(/^\s*\d+\.\s+/, '').trim();
function findSection(rows, text) {
  const t = text.toLowerCase();
  return rows.findIndex(r => r.length && clean(r[0]).toLowerCase().startsWith(t));
}
function titleOf(rows, text, fallback) {
  const i = findSection(rows, text);
  return i < 0 ? fallback : clean(rows[i][0]);
}
function getTable(rows, text) {
  const s = findSection(rows, text);
  if (s < 0) return null;
  let h = -1;
  for (let i = s + 1; i < Math.min(s + 5, rows.length); i++) if (filled(rows[i]) >= 3) { h = i; break; }
  if (h < 0) return null;
  const header = rows[h], body = [], notes = [];
  let i = h + 1;
  for (; i < rows.length; i++) {
    const r = rows[i];
    if (filled(r) === 0) { const nx = rows[i+1]; if (nx && /^total/i.test(nx[0] || '')) continue; break; }
    if (filled(r) < 2) break;
    body.push(r);
  }
  for (; i < rows.length && filled(rows[i]) === 1; i++) notes.push(rows[i][0]);
  return { header, rows: body, notes };
}
function getList(rows, text) {
  const s = findSection(rows, text);
  if (s < 0) return [];
  const out = [];
  for (let i = s + 1; i < rows.length && filled(rows[i]) > 0; i++) out.push(rows[i]);
  return out;
}
function getPrefixed(rows, prefix) {
  const r = rows.find(r => r.length && String(r[0]).toLowerCase().startsWith(prefix.toLowerCase()));
  return r ? r[0] : null;
}
const isTotal = r => /^total/i.test(r[0] || '');
const isRecon = r => /^(category totals|difference)/i.test(r[0] || '');

/* ============================== HTML BUILDERS ============================== */
function fmtCell(v, i, opts) {
  const s = String(v ?? '');
  if (opts.badgeCol === i && s) return `<td><span class="badge ${/^actual/i.test(s) ? 'actual' : 'model'}">${esc(s)}</span></td>`;
  const numeric = i > 0 && /^([+\-−]?\d[\d,]*(\.\d+)?%?|[—–-])$/.test(s);
  let cls = numeric ? 'num' : '';
  if (numeric) {
    if (/^\+\d/.test(s)) cls += ' pos';
    else if (/^[-−]\d/.test(s)) cls += ' neg';
    else if (/^[—–-]$/.test(s)) cls += ' dim';
  }
  return `<td class="${cls}">${esc(s)}</td>`;
}
function tableHTML(t, opts = {}) {
  const labels = opts.labels || {};
  const colNumeric = t.header.map((_, i) => i > 0 && t.rows.some(r => /^[+\-−]?\d/.test(r[i] || '')) && t.rows.every(r => !r[i] || /^([+\-−]?\d[\d,]*(\.\d+)?%?|[—–-]|New)$/.test(r[i])));
  const head = t.header.map((h, i) => `<th class="${colNumeric[i] ? 'num' : ''}">${esc(labels[h] || h)}</th>`).join('');
  const body = t.rows.map(r => {
    const cls = isTotal(r) ? 'total' : isRecon(r) ? 'muted' : '';
    return `<tr class="${cls}">${t.header.map((_, i) => fmtCell(r[i] ?? '', i, opts)).join('')}</tr>`;
  }).join('');
  return `<div class="table-wrap reveal"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const notesHTML = n => (n || []).map(x => `<p class="note">${esc(x)}</p>`).join('');
const block = (title, sub, inner) =>
  `<section class="block reveal"><h2>${esc(title)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}${inner}</section>`;
const chartCard = (id, title, o = {}) =>
  `<div class="chart-card reveal${o.full ? ' full' : ''}"><h3>${esc(title)}</h3><div class="chart-box${o.tall ? ' tall' : ''}"><canvas id="${id}"></canvas></div></div>`;
const grid = (...cards) => `<div class="chart-grid">${cards.join('')}</div>`;
const kpi = (label, value, tone) => {
  const t = tone || (/^\+\d/.test(value) ? 'pos' : /^[-−]\d/.test(value) ? 'neg' : '');
  return `<div class="kpi reveal"><div class="label">${esc(label)}</div><div class="value ${t}" data-count="${esc(value)}">${esc(value)}</div></div>`;
};
const kpiRow = (header, row) => `<div class="kpis">${header.map((h, i) => kpi(h, row[i] ?? '—')).join('')}</div>`;
const insights = rows => rows.length ? `<ul class="insights">${rows.map(r => `<li class="reveal">${esc(r[0])}</li>`).join('')}</ul>` : '';
const noteLine = text => text ? `<p class="note">${esc(text.replace(/^Source & notes:\s*/i, ''))}</p>` : '';
const missing = what => `<div class="empty"><strong>Couldn't find “${esc(what)}”</strong>This section isn't in the sheet right now, or its heading was renamed.</div>`;

Chart.register({
  id: 'valueLabels',
  afterDatasetsDraw(chart, _a, opts) {
    if (!opts || !opts.show) return;
    const { ctx } = chart, horiz = chart.options.indexAxis === 'y';
    ctx.save(); ctx.fillStyle = '#f4efe3'; ctx.font = '600 11px Inter'; ctx.textBaseline = 'middle';
    chart.data.datasets.forEach((ds, di) => {
      if (!chart.isDatasetVisible(di)) return;
      chart.getDatasetMeta(di).data.forEach((el, i) => {
        const v = ds.data[i]; if (v == null) return;
        const txt = v + (opts.suffix || '');
        if (horiz) { ctx.textAlign = 'left'; ctx.fillText(txt, el.x + 6, el.y); }
        else { ctx.textAlign = 'center'; ctx.fillText(txt, el.x, el.y - 9); }
      });
    });
    ctx.restore();
  }
});
const GRID = { color: 'rgba(255,255,255,0.05)' };
const C = { blue:'#7fb0ff', rose:'#ff8aa1', indigo:'#a594ff', teal:'#5eead4', amber:'#f5c26b', violet:'#a594ff', slate:'#6b7287' };
const CAT_COLORS = ['#a594ff', '#7fb0ff', '#5eead4', '#f5c26b', '#ff8aa1'];

let charts = {};
const pending = {};
const chartIO = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { chartIO.unobserve(e.target); buildChart(e.target.id); } });
}, { threshold: 0.15 }) : null;
function buildChart(id) {
  const el = document.getElementById(id), cfg = pending[id];
  if (!el || !cfg) return;
  delete pending[id];
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, cfg);
}
/* Charts are created when they scroll into view, so their draw animation is actually seen */
function mk(id, cfg) {
  const el = document.getElementById(id); if (!el) return;
  pending[id] = cfg;
  if (chartIO) chartIO.observe(el); else buildChart(id);
}
function clearCharts(panel) {
  panel.querySelectorAll('canvas').forEach(c => {
    if (charts[c.id]) { charts[c.id].destroy(); delete charts[c.id]; }
    delete pending[c.id];
    if (chartIO) chartIO.unobserve(c);
  });
}
function gradFill(col, horiz) {
  return ctx => {
    const ch = ctx.chart, a = ch.chartArea;
    if (!a || !col) return col;
    const g = horiz ? ch.ctx.createLinearGradient(a.left, 0, a.right, 0) : ch.ctx.createLinearGradient(0, a.top, 0, a.bottom);
    g.addColorStop(0, horiz ? col + '55' : col);
    g.addColorStop(1, horiz ? col : col + '55');
    return g;
  };
}
function barCfg(labels, datasets, o = {}) {
  const horiz = !!o.horizontal, pct = !!o.pct, stacked = !!o.stacked;
  const val = { beginAtZero: true, stacked, grid: GRID, border: { display: false }, grace: stacked ? 0 : '14%', ticks: pct ? { callback: v => v + '%' } : {} };
  const cat = { stacked, grid: { display: false }, border: { display: false } };
  const sets = datasets.map(d => {
    if (stacked) return d;
    const c = d.backgroundColor;
    return { ...d, backgroundColor: ctx => gradFill(Array.isArray(c) ? c[(ctx.dataIndex || 0) % c.length] : c, horiz)(ctx) };
  });
  return {
    type: 'bar',
    data: { labels, datasets: sets },
    options: {
      indexAxis: horiz ? 'y' : 'x',
      plugins: {
        legend: { display: datasets.length > 1, position: 'top' },
        valueLabels: { show: !!o.values, suffix: pct ? '%' : '' },
        tooltip: pct ? { callbacks: { label: c => `${c.dataset.label}: ${c.parsed[horiz ? 'x' : 'y']}%` } } : {}
      },
      scales: horiz ? { x: val, y: cat } : { y: val, x: cat }
    }
  };
}

    ? kpiRow(call.header, call.rows[0] || []) + grid(chartCard('s_funnel', 'Call funnel')) : missing('Calling campaign'));
  html += block(titleOf(rows, 'GOY registrations', 'GOY registrations'), '', goy
    ? kpiRow(goy.header, goy.rows[0] || []) + grid(chartCard('s_goy', 'GOY registrations: 2026 vs 2027')) : missing('GOY registrations'));
  if (tell.length) html += block(titleOf(rows, 'What the numbers', 'What the numbers are telling us'), '', insights(tell));
  if (guide.length) {
    html += block('Guide to the tabs', '', `<div class="guide">${guide.map(g => {

    if (head) {

      const idx = [0, 1, 2].filter(i => num(r[i]) != null);
      mk('s_years', barCfg(idx.map(i => h[i].replace(/\s*Registrations/i, '')), [{ label: 'Registrations', data: idx.map(i => num(r[i])), backgroundColor: [C.blue, C.indigo, C.rose] }], { values: true }));
    }
    if (call) {

      mk('s_funnel', barCfg(call.header.slice(0, 3), [{ label: 'Count', data: [num(r[0]), num(r[1]), num(r[2])], backgroundColor: [C.indigo, C.blue, C.teal] }], { horizontal: true, values: true }));

      const cols = [[1, C.slate], [2, C.blue], [3, C.rose]];
      mk('r_totals', {
        type: 'line',
        data: {
          labels: t2.rows.map(r => r[0] + ' days'),
          datasets: cols.map(([i, col]) => ({ label: t2.header[i], data: t2.rows.map(r => num(r[i])), borderColor: col, backgroundColor: col, borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 6, tension: .35, spanGaps: false }))
        },
        options: { interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true, grid: GRID, border: { display: false } }, x: { grid: { display: false } } } }
      });
    }
    if (t3) {
      const body = t3.rows.filter(r => !isTotal(r));
      mk('r_cats', barCfg(body.map(r => r[0]), [ds(t3.header[1], body.map(r => num(r[1])), C.blue), ds(t3.header[2], body.map(r => num(r[2])), C.rose)], { values: true }));
    }
    if (t4) {
      const ti = t4.header.findIndex(h => /^type$/i.test(h));
      const types = t4.rows.map(r => r[ti] || '');
      const line = (i, col) => ({
        label: t4.header[i], data: t4.rows.map(r => num(r[i])), borderColor: col, backgroundColor: col + '1f', fill: true, tension: .35, borderWidth: 2.5,
        pointRadius: c => types[c.dataIndex] === 'Actual' ? 5 : 2, pointHoverRadius: 6,
        segment: { borderDash: c => types[c.p1DataIndex] === 'Extrapolated' ? [6, 5] : undefined }
      });
      mk('r_trend', {
        type: 'line',
        data: { labels: t4.rows.map(r => r[0] + ' days'), datasets: [line(1, C.blue), line(2, C.rose)] },
        options: { interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'top' }, tooltip: { callbacks: { afterBody: items => types[items[0].dataIndex] } } }, scales: { y: { beginAtZero: true, grid: GRID, border: { display: false } }, x: { grid: { display: false } } } }
      });
    }
  };
  return { html, draw };
}

function renderCalling(rows) {
  const t = getTable(rows, 'Performance by call category'), f = getTable(rows, 'Overall call funnel');
  const gl = getList(rows, 'Glossary'), take = getList(rows, 'Key takeaways');
  const labels = { 'Picked Up': 'Pick-up rate', 'Connected Calls': 'Conversion of connected calls', 'Registration Conversion Rate': 'Conversion of attempted calls' };
  const cats = t ? t.rows.filter(r => !isTotal(r)) : [];
  const tot = t ? t.rows.find(isTotal) : null;
  let html = '';

  const lede = getPrefixed(rows, 'What this shows:');
  if (lede) html += `<p class="lede">${esc(lede.replace(/^What this shows:\s*/i, ''))}</p>`;
  if (tot) html += `<div class="kpis">${kpi('Calls attempted', tot[1])}${kpi('Calls connected', tot[2])}${kpi('Conversions', tot[3])}${kpi('Pick-up rate', tot[4])}${kpi('Conversion of connected calls', tot[5])}${kpi('Conversion of attempted calls', tot[6])}</div>`;

  html += block(titleOf(rows, 'Overall call funnel', 'Call funnel'), '',
    f ? grid(chartCard('c_funnel', 'Attempted → Connected → Registered')) + tableHTML(f) : missing('Overall call funnel'));
  html += block(titleOf(rows, 'Performance by call category', 'Performance by call category'), '',
    t ? grid(chartCard('c_vol', 'Calls by category'), chartCard('c_rate', 'Rates by category')) + tableHTML(t, { labels }) + notesHTML(t.notes) : missing('Performance by call category'));
  if (gl.length) html += block('Glossary', '', `<dl class="gloss">${gl.map(g => `<dt>${esc(g[0])}</dt><dd>${esc(g[1] || '')}</dd>`).join('')}</dl>`);
  if (take.length) html += block('Key takeaways', '', insights(take));

  const draw = () => {
    if (f) mk('c_funnel', barCfg(f.rows.map(r => r[0]), [{ label: 'Count', data: f.rows.map(r => num(r[1])), backgroundColor: [C.indigo, C.blue, C.teal] }], { horizontal: true, values: true }));
    if (t) {
      const L = cats.map(r => wrap(r[0], 14));
      mk('c_vol', barCfg(L, [ds('Attempted', cats.map(r => num(r[1])), C.indigo), ds('Connected', cats.map(r => num(r[2])), C.blue), ds('Conversions', cats.map(r => num(r[3])), C.teal)]));
      mk('c_rate', barCfg(L, [ds('Pick-up rate', cats.map(r => num(r[4])), C.violet), ds('Conversion of connected', cats.map(r => num(r[5])), C.amber), ds('Conversion of attempted', cats.map(r => num(r[6])), C.rose)], { pct: true }));
    }
  };
  return { html, draw };
}

function renderGoy(rows) {
  const t1 = getTable(rows, 'Key numbers'), t2 = getTable(rows, 'Category comparison'),
        t3 = getTable(rows, 'Country-wise'), t4 = getTable(rows, 'India vs other');
  const take = getList(rows, 'Key takeaways'), source = getPrefixed(rows, 'Source & notes:');
  const countries = t3 ? t3.rows.filter(r => !isTotal(r) && !isRecon(r)) : [];
  const totI = t3 ? t3.header.findIndex(h => /^total$/i.test(h)) : -1;
  const top = [...countries].sort((a, b) => (num(b[totI]) || 0) - (num(a[totI]) || 0)).slice(0, 10);
  let html = '';

  const lede = getPrefixed(rows, 'What this shows:');
  if (lede) html += `<p class="lede">${esc(lede.replace(/^What this shows:\s*/i, ''))}</p>`;

  html += block(titleOf(rows, 'Key numbers', 'Key numbers'), '',
    t1 ? grid(chartCard('g_years', 'GOY registrations by year')) + tableHTML(t1) + notesHTML(t1.notes) : missing('Key numbers'));
  html += block(titleOf(rows, 'Category comparison', 'Category comparison'), '',
    t2 ? grid(chartCard('g_cats', '2026 vs 2027 by program', { full: true })) + tableHTML(t2) + notesHTML(t2.notes) : missing('Category comparison'));
  html += block(titleOf(rows, 'Country-wise', 'Country-wise registrations'), '',
    t3 ? grid(chartCard('g_countries', 'Top 10 countries, split by program', { full: true, tall: true })) + tableHTML(t3) + notesHTML(t3.notes) : missing('Country-wise registrations'));
  html += block(titleOf(rows, 'India vs other', 'India vs other countries'), '',
    t4 ? grid(chartCard('g_india_cat', 'India vs other countries by program'), chartCard('g_india_all', 'India share of all registrations')) + tableHTML(t4) + notesHTML(t4.notes) : missing('India vs other countries'));
  if (take.length) html += block('Key takeaways', '', insights(take));
  if (source) html += noteLine(source);

  const draw = () => {
    if (t1) mk('g_years', barCfg(t1.rows.map(r => r[0]), [{ label: t1.header[1], data: t1.rows.map(r => num(r[1])), backgroundColor: [C.blue, C.rose] }], { values: true }));
    if (t2) {
      const body = t2.rows.filter(r => !isTotal(r));
      mk('g_cats', barCfg(body.map(r => r[0]), [ds(t2.header[1], body.map(r => num(r[1])), C.blue), ds(t2.header[2], body.map(r => num(r[2])), C.rose)], { values: true }));
    }
    if (t3 && totI > 1) {
      const progs = t3.header.slice(1, totI);
      mk('g_countries', barCfg(top.map(r => r[0]), progs.map((p, k) => ds(p, top.map(r => num(r[k + 1]) || 0), CAT_COLORS[k % CAT_COLORS.length])), { horizontal: true, stacked: true }));
    }
    if (t4) {
      const body = t4.rows.filter(r => !isTotal(r)), tot = t4.rows.find(isTotal);
      mk('g_india_cat', barCfg(body.map(r => r[0]), [ds('India', body.map(r => num(r[1])), C.amber), ds('Other countries', body.map(r => num(r[2])), C.teal)], { stacked: true }));
      if (tot) mk('g_india_all', {
        type: 'doughnut',
        data: { labels: ['India', 'Other countries'], datasets: [{ data: [num(tot[1]), num(tot[2])], backgroundColor: [C.amber, C.teal], borderWidth: 0, hoverOffset: 10, spacing: 3 }] },
        options: { cutout: '68%', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => `${c.label}: ${c.raw}` } } } }
      });
    }
  };
  return { html, draw };
}

function renderGeneric(rows, title) {
  if (!rows.length || (rows.length === 1 && filled(rows[0]) <= 1)) {
    return { html: `<div class="empty reveal"><strong>${rows.length ? esc(rows[0][0]) : 'Nothing here yet'}</strong>No data has been added to “${esc(title)}” yet. It will appear here as soon as it is filled in.</div>`, draw() {} };
  }
  const heading = filled(rows[0]) === 1 ? rows[0][0] : title;
  const rest = (filled(rows[0]) === 1 ? rows.slice(1) : rows).filter(r => filled(r) > 0);
  const wide = Math.max(0, ...rest.map(filled)) >= 3;
  let inner;
  if (wide) {
    const header = rest[0], body = rest.slice(1);
    inner = tableHTML({ header, rows: body.map(r => header.map((_, i) => r[i] ?? '')) });
  } else {
    inner = `<ol class="numbered">${rest.map(r => {
      const hasN = /^\d+$/.test(r[0] || '') && r.length > 1;
      const text = (hasN ? r.slice(1) : r).filter(Boolean).join(' – ');
      return `<li class="reveal">${hasN ? `<span class="n">${esc(r[0])}</span>` : ''}<span>${esc(text)}</span></li>`;
    }).join('')}</ol>`;
  }
  return { html: block(heading, '', inner), draw() {} };
}

const RENDERERS = {
  summary: renderSummary, registrations: renderRegistrations, calling: renderCalling, goy: renderGoy,
  promotions: r => renderGeneric(r, 'Non Madhyamaheshwar Promotions'),
  tracker: r => renderGeneric(r, 'Cumulative Tracker')
};

/* ============================== MOTION ============================== */
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* count a KPI up from zero, keeping its sign, % and decimals */
function countUp(el) {
  const raw = el.dataset.count || '';
  const m = raw.match(/^([+\-−]?)(\d[\d,]*\.?\d*)(.*)$/);
  if (!m || reduceMotion) return;
  const target = parseFloat(m[2].replace(/,/g, ''));
  const dec = (m[2].split('.')[1] || '').length, commas = m[2].includes(',') || target >= 1000;
  const fmt = v => (commas ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec));
  const t0 = performance.now(), dur = 1500;
  (function step(now) {
    const p = Math.min((now - t0) / dur, 1), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
    el.textContent = m[1] + fmt(target * e) + m[3];
    if (p < 1) requestAnimationFrame(step); else el.textContent = raw;
  })(t0);
}
const revealIO = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    revealIO.unobserve(e.target);
    e.target.classList.add('in');
    const v = e.target.querySelector('.value[data-count]');
    if (v) countUp(v);
  });
}, { threshold: 0.08, rootMargin: '0px 0px -5% 0px' }) : null;

function enhance(panel) {
  panel.querySelectorAll('.reveal').forEach(el => {
    const sibs = [...el.parentElement.children].filter(c => c.classList.contains('reveal'));
    el.style.setProperty('--i', Math.min(sibs.indexOf(el), 8));
    if (revealIO) revealIO.observe(el); else el.classList.add('in');
  });
}
/* soft spotlight that follows the pointer over cards */
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.kpi, .chart-card, .guide button, .numbered li');
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  c.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });

/* ============================== DATA ============================== */
const state = { rows: {}, source: {}, rendered: {}, active: 'summary' };
TABS.forEach(t => { state.rows[t.key] = SNAPSHOT[t.key] || []; state.source[t.key] = 'snapshot'; });

/* Three ways to read a tab. Every result is checked to make sure the labels survived;
   Google's "gviz" export, for example, can blank out text cells in number-heavy columns,
   which is what made the cards show numbers where the labels should be. */
const SOURCES = [
  { name: 'published link', url: t => `https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=${t.gid}&single=true&output=csv` },
  { name: 'sheet link',     url: t => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&gid=${t.gid}` },
  { name: 'export link',    url: t => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${t.gid}` }
];
const CHECK = { summary: ['Headline numbers', 'Calling campaign'], registrations: ['Key numbers', 'Category comparison'],
                calling: ['Performance by call category'], goy: ['Key numbers', 'Category comparison'] };
function looksRight(key, rows) {
  if (key === 'tracker') return true;
  if (key === 'promotions') return rows.length > 0;
  if (rows.length < 3) return false;
  return (CHECK[key] || []).every(sec => {
    const t = getTable(rows, sec);
    return t && t.rows.length > 0 && /[a-z]/i.test(t.header[0] || '') && t.header.filter(h => /[a-z]/i.test(h)).length >= t.header.length / 2;
  });
}
const deadSrc = new Set(), goodSrc = {};
let offline = false;

async function fetchVia(si, t) {
  try {
    const u = SOURCES[si].url(t);
    const res = await fetch(u + (u.includes('?') ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return { status: 'net' };
    const text = await res.text();
    if (/^\s*<(!doctype|html)/i.test(text)) return { status: 'net' };   // sign-in or error page, not CSV
    const rows = parseCSV(text);
    return looksRight(t.key, rows) ? { status: 'ok', rows } : { status: 'bad' };
  } catch (e) { return { status: 'net' }; }
}
async function fetchTab(t) {
  const order = goodSrc[t.key] != null ? [goodSrc[t.key]] : SOURCES.map((_, i) => i).filter(i => !deadSrc.has(i));
  for (const si of order) {
    const r = await fetchVia(si, t);
    if (r.status === 'ok') { goodSrc[t.key] = si; return r.rows; }
    if (r.status === 'net') deadSrc.add(si);      // unreachable: don't try it again for other tabs
  }
  return null;
}

let loading = false;
async function loadData(manual) {
  if (loading) return;
  loading = true;
  if (manual === true) { offline = false; deadSrc.clear(); for (const k in goodSrc) delete goodSrc[k]; }
  const btn = $('#refreshBtn'), status = $('#status'), bar = $('#loadbar');
  btn.disabled = true; bar.classList.add('on');
  status.className = 'status'; status.textContent = 'Loading…';
  let live = 0;
  try {
    const got = {};
    got[TABS[0].key] = await fetchTab(TABS[0]);       // first, so unreachable addresses are learned once
    const rest = await Promise.all(TABS.slice(1).map(async t => [t.key, await fetchTab(t)]));
    rest.forEach(([k, v]) => { got[k] = v; });
    TABS.forEach(t => {
      const rows = got[t.key];
      if (!rows) { state.source[t.key] = 'saved'; return; }
      live++;
      if (JSON.stringify(rows) !== JSON.stringify(state.rows[t.key])) { state.rows[t.key] = rows; state.rendered[t.key] = false; }
      state.source[t.key] = 'live';
    });
    if (!live) offline = true;                        // nothing reachable: keep the saved copy, stop background retries
    renderActive();
  } catch (err) { console.error(err); }
  if (live === TABS.length) { status.textContent = 'Live · updated ' + new Date().toLocaleTimeString(); status.className = 'status live'; }
  else if (live > 0) { status.textContent = `Live for ${live} of ${TABS.length} tabs`; }
  else { status.textContent = `Showing saved data from ${SNAPSHOT_DATE}`; }
  $('#footStamp').textContent = TABS.map(t => `${t.title}: ${state.source[t.key] === 'live' ? SOURCES[goodSrc[t.key]].name : 'saved copy'}`).join('  ·  ')
    + (live < TABS.length ? '. For live data on every tab, publish the whole document to the web (File → Share → Publish to web → Entire document → CSV).' : '');
  btn.disabled = false; bar.classList.remove('on'); loading = false;
}

/* ============================== UI ============================== */
function $(s) { return document.querySelector(s); }

function moveInd() {
  const b = $('#tab-' + state.active), ind = $('#tabInd');
  if (!b || !ind) return;
  ind.style.width = b.offsetWidth + 'px';
  ind.style.transform = `translateX(${b.offsetLeft}px)`;
}

function buildShell() {
  $('#sheetLink').href = SHEET_URL;
  $('#pubLink').href = PUB_HTML_URL;
  const h = $('#title');
  h.setAttribute('aria-label', h.textContent);
  h.innerHTML = h.textContent.split(' ').map((w, i) => `<span class="w" style="--i:${i}" aria-hidden="true">${esc(w)}</span>`).join(' ');

  $('#tabs').insertAdjacentHTML('beforeend', TABS.map(t =>
    `<button class="tab" role="tab" id="tab-${t.key}" aria-controls="panel-${t.key}" aria-selected="false" tabindex="-1" data-key="${t.key}">${esc(t.title)}</button>`).join(''));
  $('#panels').innerHTML = TABS.map(t =>
    `<div class="panel" role="tabpanel" id="panel-${t.key}" aria-labelledby="tab-${t.key}" hidden></div>`).join('');

  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) activate(b.dataset.key, true); });
  $('#tabs').addEventListener('keydown', e => {
    const i = TABS.findIndex(t => t.key === state.active);
    let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % TABS.length;
    else if (e.key === 'ArrowLeft') n = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = TABS.length - 1;
    if (n != null) { e.preventDefault(); activate(TABS[n].key, true); $('#tab-' + TABS[n].key).focus(); }
  });
  $('#panels').addEventListener('click', e => {
    const b = e.target.closest('[data-goto]');
    if (b && b.dataset.goto) { activate(b.dataset.goto, true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (TABS.some(t => t.key === k)) activate(k, false); });
  window.addEventListener('resize', moveInd);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
}

function renderActive() {
  const key = state.active, panel = $('#panel-' + key);
  if (state.rendered[key]) return;
  clearCharts(panel);
  let out;
  try { out = RENDERERS[key](state.rows[key], TABS.find(t => t.key === key).title); }
  catch (err) { console.error(err); out = { html: `<div class="empty"><strong>This tab couldn't be displayed</strong>${esc(err.message)}</div>`, draw() {} }; }
  panel.innerHTML = out.html;
  try { out.draw(); } catch (err) { console.error(err); }
  enhance(panel);
  state.rendered[key] = true;
}

function activate(key, updateHash) {
  state.active = key;
  TABS.forEach(t => {
    const sel = t.key === key;
    const b = $('#tab-' + t.key); b.setAttribute('aria-selected', sel); b.tabIndex = sel ? 0 : -1;
    const p = $('#panel-' + t.key); p.hidden = !sel;
  });
  moveInd();
  try { $('#tab-' + key).scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); } catch (e) {}
  renderActive();
  if (updateHash) { try { if (location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key); } catch (e) { /* embedded previews can block this */ } }
}

buildShell();
$('#refreshBtn').addEventListener('click', () => loadData(true));
const startKey = location.hash.slice(1);
activate(TABS.some(t => t.key === startKey) ? startKey : 'summary', false);   // the saved copy appears instantly
loadData();
setInterval(() => { if (!offline) loadData(); }, REFRESH_MS);
</script>
</body>
